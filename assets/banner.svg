<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080e1c" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176fc" />
      <stop offset="100%" stop-color="#e0c3fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.1); }
      }
      @keyframes telemetryWave {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes signalStream {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-8px) translateX(6px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes beaconRing {
        0% { r: 6px; opacity: 0.9; }
        100% { r: 24px; opacity: 0; }
      }

      .ambient-glow-1 {
        animation: pulseLight 6s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .ambient-glow-2 {
        animation: pulseLight 8s ease-in-out infinite alternate;
        transform-origin: 1000px 280px;
      }
      .stream-path {
        stroke-dasharray: 40 20;
        animation: signalStream 14s linear infinite;
      }
      .wave-path {
        stroke-dasharray: 12 8;
        animation: telemetryWave 10s linear infinite;
      }
      .beacon {
        animation: beaconRing 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
      .particle-4 { animation: floatParticle 4.5s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glows (strictly background) -->
  <circle class="ambient-glow-1" cx="220" cy="90" r="140" fill="#00f2fe" opacity="0.15" filter="url(#softGlow)" />
  <circle class="ambient-glow-2" cx="1020" cy="270" r="160" fill="#b176fc" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="600" cy="380" r="180" fill="#11998e" opacity="0.1" filter="url(#softGlow)" />

  <!-- Dynamic Animated IoT Telemetry Streams (strictly background & lower margin) -->
  <g opacity="0.45">
    <path class="stream-path" d="M -50,330 C 250,290 400,370 700,320 C 950,280 1080,340 1250,310" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <path class="wave-path" d="M -50,350 C 180,310 380,380 620,340 C 850,300 1020,370 1250,335" fill="none" stroke="url(#accentGlow)" stroke-width="1.8" />
    <path class="stream-path" d="M -50,50 C 300,100 550,20 850,70 C 1020,100 1120,40 1250,60" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- IoT Node Signal Points (background decorative) -->
  <g opacity="0.6">
    <circle cx="980" cy="80" r="4" fill="#00f2fe" />
    <circle class="beacon" cx="980" cy="80" stroke="#00f2fe" stroke-width="1.5" fill="none" />
    
    <circle cx="1110" cy="190" r="3.5" fill="#38ef7d" />
    <circle class="beacon" cx="1110" cy="190" stroke="#38ef7d" stroke-width="1.5" fill="none" />

    <circle cx="90" cy="290" r="4" fill="#b176fc" />
    <circle class="beacon" cx="90" cy="290" stroke="#b176fc" stroke-width="1.5" fill="none" />

    <circle class="particle-1" cx="340" cy="60" r="3" fill="#00f2fe" />
    <circle class="particle-2" cx="820" cy="50" r="2.5" fill="#38ef7d" />
    <circle class="particle-3" cx="150" cy="190" r="2.5" fill="#4facfe" />
    <circle class="particle-4" cx="1060" cy="320" r="3" fill="#e0c3fc" />
  </g>

  <!-- FOREGROUND LAYER: Content strictly structured to remain 100% visible and unblocked -->
  <!-- Top Badge / Pill -->
  <g transform="translate(60, 48)">
    <rect width="360" height="34" rx="17" fill="#132247" stroke="#25427d" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38ef7d" filter="url(#glow)" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5d8ff" letter-spacing="1.2">
      ENTERPRISE TELEMETRY &amp; EVENT STREAMING
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 138)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Awesome IoT Analytics &amp;
    </text>
    <text x="590" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#neonCyan)" letter-spacing="-0.8">
      Event Monitoring
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 185)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated directory of SaaS suites, open-source platforms, time-series engines, and MQTT stream processors
    </text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748b" letter-spacing="0.2">
      engineered for edge device telemetry, industrial SCADA/PLC pipelines, and real-time operational intelligence.
    </text>
  </g>

  <!-- Metric Pills / Tags -->
  <g transform="translate(60, 265)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="#101c38" stroke="#1e3466" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#38ef7d">📡 Edge Telemetry</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(192, 0)">
      <rect width="206" height="36" rx="8" fill="#101c38" stroke="#1e3466" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#00f2fe">⏱️ Time-Series TSDB</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(410, 0)">
      <rect width="210" height="36" rx="8" fill="#101c38" stroke="#1e3466" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#b176fc">🚨 Anomaly Detection</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(632, 0)">
      <rect width="195" height="36" rx="8" fill="#101c38" stroke="#1e3466" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f6ad55">🏭 Industrial IIoT</text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(839, 0)">
      <rect width="225" height="36" rx="8" fill="#101c38" stroke="#1e3466" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#63b3ed">🔄 MQTT &amp; Event Stream</text>
    </g>
  </g>

  <!-- Subtle bottom border glow -->
  <line x1="0" y1="379" x2="1200" y2="379" stroke="url(#accentGlow)" stroke-width="2" opacity="0.8" />
</svg>
